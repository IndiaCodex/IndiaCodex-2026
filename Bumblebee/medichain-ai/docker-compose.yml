version: '3.9'

networks:
  medichain-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  vault_data:

services:

  # ──────────────────────────────────────────────
  # DATABASE
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medichain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medichain}
      POSTGRES_USER: ${POSTGRES_USER:-medichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medichain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medichain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # CACHE — VALKEY
  # ──────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: medichain-valkey
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - medichain-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # MESSAGE QUEUE — KAFKA
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medichain-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - medichain-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medichain-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # IDENTITY — KEYCLOAK
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: medichain-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/medichain
      KC_DB_USERNAME: ${POSTGRES_USER:-medichain}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medichain-network
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  # ──────────────────────────────────────────────
  # OBJECT STORAGE — MINIO
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: medichain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # SECRETS — HASHICORP VAULT
  # ──────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.16
    container_name: medichain-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-changeme}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # BACKEND — SPRING BOOT
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medichain-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medichain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medichain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${VALKEY_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      JWT_SECRET: ${JWT_SECRET:-changeme}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT}
      AZURE_AI_KEY: ${AZURE_AI_KEY}
      CARDANO_BLOCKFROST_API_KEY: ${CARDANO_BLOCKFROST_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # AI AGENTS
  # ──────────────────────────────────────────────
  ai-agents:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: medichain-ai-agents
    ports:
      - "8090:8090"
    environment:
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT}
      AZURE_AI_KEY: ${AZURE_AI_KEY}
      MASUMI_API_KEY: ${MASUMI_API_KEY}
      MASUMI_WALLET_ADDRESS: ${MASUMI_WALLET_ADDRESS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # FRONTEND — REACT
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medichain-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8180
    depends_on:
      - backend
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # REVERSE PROXY — NGINX
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: medichain-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # MONITORING — PROMETHEUS
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: medichain-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # DASHBOARDS — GRAFANA
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: medichain-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # LOGGING — LOKI
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: medichain-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - medichain-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: medichain-promtail
    volumes:
      - /var/log:/var/log
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # TRACING — JAEGER
  # ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: medichain-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - medichain-network

  # ──────────────────────────────────────────────
  # OTEL COLLECTOR
  # ──────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: medichain-otel
    ports:
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./infrastructure/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    command: ["--config=/etc/otel-collector-config.yml"]
    networks:
      - medichain-network
